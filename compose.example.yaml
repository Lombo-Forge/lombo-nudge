# Drop-in service block. Put it in your own compose file, or run it on its own with:
#   docker compose -f compose.example.yaml up -d
services:
  lombo-nudge:
    image: ghcr.io/lombo-forge/lombo-nudge:latest   # or build: .
    container_name: lombo-nudge
    restart: unless-stopped
    env_file: .env
    read_only: true
    mem_limit: 128m
    volumes:
      - ./data:/data   # remembers progress and which alerts were sent (the folder must be writable by uid 999)
    # If Seerr, Sonarr and Radarr are in another compose project, join its network:
    # networks: [media]
# networks:
#   media:
#     external: true
